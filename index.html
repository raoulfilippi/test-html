<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Programmazione Email</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-paper-plane text-2xl text-indigo-200"></i>
                <h1 class="text-xl font-bold tracking-tight">Dashboard Email Programmate</h1>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-800 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition-all shadow-sm border border-indigo-500">
                <i class="fa-solid fa-list-check"></i>
                <span>📋 Lista Invii</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Card Form -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-indigo-600"></i> Nuova Email Programmata
                </h2>
                <span class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-200 font-medium px-2.5 py-1 rounded-full">Google Apps Script Connected</span>
            </div>

            <form id="emailForm" onsubmit="handleSubmit(event)" class="p-6 space-y-6">
                
                <!-- Grid 2 colonne: Destinatario & Data/Ora -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="to" class="block text-sm font-medium text-slate-700 mb-1">Destinatario (Email) *</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" id="to" required placeholder="cliente@esempio.com" 
                                class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                        </div>
                    </div>

                    <div>
                        <label for="scheduleTime" class="block text-sm font-medium text-slate-700 mb-1">Data e Ora Invio *</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-regular fa-calendar-check"></i>
                            </span>
                            <input type="datetime-local" id="scheduleTime" required 
                                class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                        </div>
                    </div>
                </div>

                <!-- Oggetto -->
                <div>
                    <label for="subject" class="block text-sm font-medium text-slate-700 mb-1">Oggetto dell'email *</label>
                    <input type="text" id="subject" required placeholder="Es. Conferma corso di formazione" 
                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                </div>

                <!-- Messaggio -->
                <div>
                    <label for="body" class="block text-sm font-medium text-slate-700 mb-1">Testo del messaggio *</label>
                    <textarea id="body" rows="6" required placeholder="Scrivi qui il testo dell'email..." 
                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all resize-y"></textarea>
                </div>

                <!-- Allegato Facoltativo -->
                <div>
                    <label for="attachment" class="block text-sm font-medium text-slate-700 mb-1">Allegato (Opzionale)</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="attachment" class="flex flex-col items-center justify-center w-full h-28 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 transition-all">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <i class="fa-solid fa-cloud-arrow-up text-slate-400 text-2xl mb-1"></i>
                                <p class="text-xs text-slate-600"><span class="font-semibold text-indigo-600">Clicca per allegare</span> o trascina qui un file</p>
                                <p class="text-xs text-slate-400 mt-1" id="fileName">PDF, DOCX, XLSX, PNG (Max 10MB)</p>
                            </div>
                            <input id="attachment" type="file" class="hidden" onchange="updateFileName(this)" />
                        </label>
                    </div>
                </div>

                <!-- Status Feedback -->
                <div id="statusMessage" class="hidden p-4 rounded-lg text-sm font-medium"></div>

                <!-- Submit Button -->
                <div class="flex justify-end pt-2">
                    <button type="submit" id="submitBtn" 
                        class="w-full md:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg shadow-sm hover:shadow transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Programma Email</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Modal Lista Invii -->
    <div id="listModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <!-- Modal Header -->
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> Lista Email Programmate
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200 transition-all">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto flex-1">
                <div id="modalLoading" class="text-center py-8">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-2"></i>
                    <p class="text-slate-500 text-sm">Caricamento programmazioni in corso...</p>
                </div>

                <div id="modalContent" class="hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-500 bg-slate-50">
                                    <th class="py-3 px-4 font-semibold">Riga</th>
                                    <th class="py-3 px-4 font-semibold">Destinatario</th>
                                    <th class="py-3 px-4 font-semibold">Oggetto</th>
                                    <th class="py-3 px-4 font-semibold">Data Ora Invio</th>
                                    <th class="py-3 px-4 font-semibold text-center">Azione</th>
                                </tr>
                            </thead>
                            <tbody id="scheduledTableBody" class="divide-y divide-slate-100 text-slate-700">
                                <!-- Righe generate dinamicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center text-xs text-slate-500">
                <span>Aggiornato in tempo reale</span>
                <button onclick="fetchScheduledList()" class="text-indigo-600 hover:underline font-medium flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Rinfresca
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // URL di Google Apps Script Web App
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw0xBplafCw5cR3yxepDw8vN1ZTt9ZxAz90wlmIi5j32y1Y-4vPInouuz2VwoyWpPp8/exec';

        // Mostra nome file selezionato
        function updateFileName(input) {
            const fileNameContainer = document.getElementById('fileName');
            if (input.files && input.files[0]) {
                fileNameContainer.textContent = '📎 ' + input.files[0].name;
                fileNameContainer.classList.add('text-indigo-600', 'font-medium');
            } else {
                fileNameContainer.textContent = 'PDF, DOCX, XLSX, PNG (Max 10MB)';
                fileNameContainer.classList.remove('text-indigo-600', 'font-medium');
            }
        }

        // Converte file in Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve({
                        base64: base64String,
                        name: file.name,
                        mimeType: file.type
                    });
                };
                reader.onerror = error => reject(error);
            });
        }

        // Gestione Invio Form
        async function handleSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            const fileInput = document.getElementById('attachment');

            // Imposta stato di caricamento
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Invio in corso...';
            statusMsg.className = 'hidden';

            try {
                let attachmentData = null;
                if (fileInput.files.length > 0) {
                    attachmentData = await fileToBase64(fileInput.files[0]);
                }

                const payload = {
                    action: "create",
                    to: document.getElementById('to').value,
                    subject: document.getElementById('subject').value,
                    body: document.getElementById('body').value,
                    scheduleTime: document.getElementById('scheduleTime').value,
                    attachment: attachmentData
                };

                // Invio a Google Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success" || result.result === "success") {
                    statusMsg.className = 'p-4 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 block';
                    statusMsg.innerHTML = '✅ Email programmata con successo!';
                    document.getElementById('emailForm').reset();
                    document.getElementById('fileName').textContent = 'PDF, DOCX, XLSX, PNG (Max 10MB)';
                } else {
                    throw new Error(result.message || 'Errore durante la registrazione.');
                }
            } catch (err) {
                console.error(err);
                statusMsg.className = 'p-4 rounded-lg text-sm font-medium bg-rose-50 text-rose-800 border border-rose-200 block';
                statusMsg.innerHTML = '⚠️ Invio completato. Verificare la tabella per confermare la registrazione.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Programma Email</span>';
            }
        }

        // Gestione Modal
        function openModal() {
            document.getElementById('listModal').classList.remove('hidden');
            fetchScheduledList();
        }

        function closeModal() {
            document.getElementById('listModal').classList.add('hidden');
        }

        // Recupera Lista Email Programmate
        async function fetchScheduledList() {
            const loading = document.getElementById('modalLoading');
            const content = document.getElementById('modalContent');
            const tableBody = document.getElementById('scheduledTableBody');

            loading.classList.remove('hidden');
            content.classList.add('hidden');
            tableBody.innerHTML = '';

            try {
                const response = await fetch(SCRIPT_URL + '?action=list');
                const data = await response.json();

                if (data && data.length > 0) {
                    data.forEach((item, index) => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-50 transition-colors';
                        tr.innerHTML = `
                            <td class="py-3 px-4 font-mono text-xs text-slate-400">#${item.riga || index + 2}</td>
                            <td class="py-3 px-4 font-medium text-slate-800">${item.to || '-'}</td>
                            <td class="py-3 px-4 text-slate-600">${item.subject || '-'}</td>
                            <td class="py-3 px-4 text-slate-600">${item.scheduleTime || '-'}</td>
                            <td class="py-3 px-4 text-center">
                                <button onclick="deleteRow(${item.riga || index + 2})" class="text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 px-3 py-1 rounded text-xs font-medium transition-all">
                                    <i class="fa-solid fa-trash-can mr-1"></i> Annulla
                                </button>
                            </td>
                        `;
                        tableBody.appendChild(tr);
                    });
                } else {
                    tableBody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-400">Nessuna email programmata trovata.</td></tr>';
                }
            } catch (err) {
                console.error(err);
                tableBody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-500">Impossibile caricare la lista o nessuna email salvata.</td></tr>';
            } finally {
                loading.classList.add('hidden');
                content.classList.remove('hidden');
            }
        }

        // Annulla/Elimina Programmazione
        async function deleteRow(riga) {
            if (!confirm(`Sei sicuro di voler annullare l'invio alla riga ${riga}?`)) return;

            try {
                const payload = {
                    action: "delete",
                    riga: riga
                };

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                alert("Invio annullato con successo!");
                fetchScheduledList();
            } catch (err) {
                console.error(err);
                alert("Errore durante l'annullamento.");
            }
        }
    </script>
</body>
</html>
