<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Contatti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-800">Contatti Casa Mare Nazioni</h1>
      <button id="authBtn" onclick="handleAuth()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg transition">
        Connetti Google
      </button>
    </div>

    <div id="status" class="hidden mb-4 p-4 rounded-lg bg-slate-50 text-slate-700 border text-sm"></div>

    <div id="contactsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </div>

  <script>
    const CLIENT_ID = '656017878983-v6gvuedvmktm8608mhd766h6kd4oqkqt.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/contacts.readonly';
    let tokenClient;

    function windowOnLoad() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        hint: 'casamarenazioni@gmail.com',
        callback: async (tokenResponse) => {
          if (tokenResponse.error !== undefined) {
            showStatus('Errore durante l\'autenticazione: ' + tokenResponse.error, true);
            return;
          }
          showStatus('Autenticato con successo! Recupero dei contatti in corso...');
          await fetchContacts(tokenResponse.access_token);
        },
      });
    }

    window.onload = windowOnLoad;

    function handleAuth() {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    async function fetchContacts(accessToken) {
      try {
        const response = await fetch(
          'https://people.googleapis.com/v1/people/me/connections?personFields=names,emailAddresses,phoneNumbers',
          {
            headers: {
              'Authorization': `Bearer ${accessToken}`,
            },
          }
        );
        const data = await response.json();
        displayContacts(data.connections || []);
      } catch (err) {
        showStatus('Errore nel recupero contatti: ' + err.message, true);
      }
    }

    function displayContacts(connections) {
      const container = document.getElementById('contactsList');
      container.innerHTML = '';

      if (connections.length === 0) {
        showStatus('Nessun contatto trovato nell\'account.');
        return;
      }

      showStatus(`Trovati ${connections.length} contatti.`);

      connections.forEach(person => {
        const name = person.names?.[0]?.displayName || 'Senza Nome';
        const email = person.emailAddresses?.[0]?.value || 'Nessuna Email';
        const phone = person.phoneNumbers?.[0]?.value || 'Nessun Telefono';

        const card = document.createElement('div');
        card.className = 'p-4 border rounded-lg bg-slate-50 shadow-sm flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <h3 class="font-semibold text-slate-900">${name}</h3>
            <p class="text-sm text-slate-600 mt-1">📧 ${email}</p>
            <p class="text-sm text-slate-500 mt-0.5">📞 ${phone}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function showStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-slate-50', 'text-slate-700');
      if (isError) {
        el.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      } else {
        el.classList.add('bg-slate-50', 'text-slate-700');
      }
      el.textContent = msg;
    }
  </script>
</body>
</html>
