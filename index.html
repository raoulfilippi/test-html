<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Contatti - Casa Mare Nazioni</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Contatti Casa Mare Nazioni</h1>
        <p class="text-xs text-slate-500 mt-1">Gestione contatti, WhatsApp e invii email programmati</p>
      </div>
      <button id="authBtn" onclick="handleAuth()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg transition shadow-sm">
        Connetti Google
      </button>
    </div>

    <!-- Status Box -->
    <div id="status" class="hidden mb-6 p-4 rounded-lg bg-slate-50 text-slate-700 border text-sm"></div>

    <!-- Control Panel -->
    <div id="controlsPanel" class="hidden mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col lg:flex-row gap-4 justify-between items-stretch lg:items-center">
      
      <!-- Barra di ricerca -->
      <div class="flex-1">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Cerca</label>
        <input type="text" id="searchInput" oninput="render()" placeholder="Cerca per nome, email, telefono o nazione..." 
               class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
      </div>

      <!-- Ordinamento -->
      <div class="w-full lg:w-40">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Ordina per</label>
        <select id="sortSelect" onchange="render()" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option value="name_asc">Nome (A-Z)</option>
          <option value="name_desc">Nome (Z-A)</option>
          <option value="lastname_asc">Cognome (A-Z)</option>
          <option value="country_asc">Nazione (A-Z)</option>
        </select>
      </div>

      <!-- Filtro Nazione -->
      <div class="w-full lg:w-40">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Filtra Nazione</label>
        <select id="countryFilter" onchange="render()" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option value="ALL">Tutte le Nazioni</option>
        </select>
      </div>

      <!-- Export & Schedule Buttons -->
      <div class="flex items-end gap-2 pt-1 lg:pt-0">
        <button onclick="openEmailModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-1">
          ✉️ Programma Email
        </button>
        <button onclick="exportData('xlsx')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-1">
          📊 Excel
        </button>
      </div>
    </div>

    <!-- Lista Contatti Grid -->
    <div id="contactsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <!-- MODAL PROGRAMMAZIONE EMAIL -->
  <div id="emailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 relative">
      <h2 class="text-xl font-bold text-slate-800 mb-4">✉️ Programma Invio Email</h2>
      
      <p class="text-xs text-slate-500 mb-4">
        L'email verrà inviata automaticamente ai <strong id="modalContactCount" class="text-indigo-600">0</strong> contatti attualmente visibili nella dashboard alla data selezionata.
      </p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Data di Invio</label>
          <input type="date" id="sendDateInput" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Oggetto Email</label>
          <input type="text" id="subjectInput" placeholder="Es. Comunicazione importante da Casa Mare Nazioni" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Messaggio (Usa {NOME} per personalizzare)</label>
          <textarea id="messageInput" rows="4" placeholder="Gentile {NOME}, le ricordiamo la prenotazione..." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-6 border-t pt-4">
        <button onclick="closeEmailModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Annulla</button>
        <button id="sendScheduleBtn" onclick="submitEmailSchedule()" class="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-sm">🚀 Programma Invio</button>
      </div>
    </div>
  </div>

  <script>
    const CLIENT_ID = '656017878983-v6gvuedvmktm8608mhd766h6kd4oqkqt.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/contacts.readonly';
    
    // URL Web App Google Apps Script generato:
    const SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw0xBplafCw5cR3yxepDw8vN1ZTt9ZxAz90wlmIi5j32y1Y-4vPInouuz2VwoyWpPp8/exec';

    let tokenClient;
    let rawContacts = [];
    let processedContacts = [];
    let currentFilteredContacts = [];

    function getCountryFromPhone(phone) {
      if (!phone || phone === 'Nessun Telefono') return { name: 'Italia', flag: '🇮🇹' };
      const cleaned = phone.replace(/[\s\-\(\)]/g, '');
      if (!cleaned.startsWith('+') && !cleaned.startsWith('00')) return { name: 'Italia', flag: '🇮🇹' };
      let num = cleaned;
      if (num.startsWith('00')) num = '+' + num.slice(2);
      if (num.startsWith('+39')) return { name: 'Italia', flag: '🇮🇹' };
      if (num.startsWith('+1')) return { name: 'Stati Uniti / Canada', flag: '🇺🇸' };
      if (num.startsWith('+44')) return { name: 'Regno Unito', flag: '🇬🇧' };
      if (num.startsWith('+33')) return { name: 'Francia', flag: '🇫🇷' };
      if (num.startsWith('+49')) return { name: 'Germania', flag: '🇩🇪' };
      if (num.startsWith('+34')) return { name: 'Spagna', flag: '🇪🇸' };
      if (num.startsWith('+41')) return { name: 'Svizzera', flag: '🇨🇭' };
      return { name: 'Estero / Altro', flag: '🌐' };
    }

    function windowOnLoad() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        hint: 'casamarenazioni@gmail.com',
        callback: async (tokenResponse) => {
          if (tokenResponse.error) {
            showStatus('Errore autenticazione: ' + tokenResponse.error, true);
            return;
          }
          showStatus('Autenticato! Recupero contatti...');
          await fetchContacts(tokenResponse.access_token);
        },
      });
    }

    window.onload = windowOnLoad;

    function handleAuth() {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    async function fetchContacts(accessToken) {
      try {
        const response = await fetch(
          'https://people.googleapis.com/v1/people/me/connections?pageSize=1000&personFields=names,emailAddresses,phoneNumbers',
          { headers: { 'Authorization': `Bearer ${accessToken}` } }
        );
        const data = await response.json();
        rawContacts = data.connections || [];
        processContacts();
        populateCountryFilter();
        document.getElementById('controlsPanel').classList.remove('hidden');
        render();
      } catch (err) {
        showStatus('Errore recupero contatti: ' + err.message, true);
      }
    }

    function processContacts() {
      processedContacts = rawContacts.map(person => {
        const nameObj = person.names?.[0];
        const displayName = nameObj?.displayName || 'Senza Nome';
        const firstName = nameObj?.givenName || displayName;
        const lastName = nameObj?.familyName || '';
        const email = person.emailAddresses?.[0]?.value || 'Nessuna Email';
        const phone = person.phoneNumbers?.[0]?.value || 'Nessun Telefono';
        const country = getCountryFromPhone(phone);
        return { displayName, firstName, lastName, email, phone, country };
      });
    }

    function populateCountryFilter() {
      const select = document.getElementById('countryFilter');
      const countries = Array.from(new Set(processedContacts.map(c => c.country.name))).sort();
      select.innerHTML = '<option value="ALL">Tutte le Nazioni</option>';
      countries.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
    }

    function openWhatsApp(phone, name) {
      let digits = phone.replace(/[^\d+]/g, '');
      if (digits.startsWith('00')) digits = '+' + digits.slice(2);
      if (!digits.startsWith('+')) digits = '+39' + digits;
      const text = encodeURIComponent(`Gentile ${name}, le scriviamo da Casa Mare Nazioni.`);
      window.open(`https://wa.me/${digits.replace('+', '')}?text=${text}`, '_blank');
    }

    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortType = document.getElementById('sortSelect').value;
      const selectedCountry = document.getElementById('countryFilter').value;

      currentFilteredContacts = processedContacts.filter(c => {
        const matchesSearch = c.displayName.toLowerCase().includes(search) ||
                              c.email.toLowerCase().includes(search) ||
                              c.phone.toLowerCase().includes(search) ||
                              c.country.name.toLowerCase().includes(search);
        const matchesCountry = selectedCountry === 'ALL' || c.country.name === selectedCountry;
        return matchesSearch && matchesCountry;
      });

      currentFilteredContacts.sort((a, b) => {
        if (sortType === 'name_asc') return a.displayName.localeCompare(b.displayName);
        if (sortType === 'name_desc') return b.displayName.localeCompare(a.displayName);
        if (sortType === 'lastname_asc') return (a.lastName || a.displayName).localeCompare(b.lastName || b.displayName);
        if (sortType === 'country_asc') return a.country.name.localeCompare(b.country.name);
        return 0;
      });

      const container = document.getElementById('contactsList');
      container.innerHTML = '';

      if (currentFilteredContacts.length === 0) {
        showStatus('Nessun contatto corrisponde ai filtri.');
        return;
      }

      showStatus(`Visualizzati ${currentFilteredContacts.length} su ${processedContacts.length} contatti.`);

      currentFilteredContacts.forEach(c => {
        const card = document.createElement('div');
        card.className = 'p-4 border rounded-xl bg-slate-50 hover:bg-white hover:shadow-md transition flex flex-col justify-between border-slate-200';
        const hasPhone = c.phone && c.phone !== 'Nessun Telefono';

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-semibold text-slate-900 leading-snug">${c.displayName}</h3>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 flex items-center gap-1 shrink-0">
                ${c.country.flag} ${c.country.name}
              </span>
            </div>
            <p class="text-xs text-slate-600 mt-2">📧 ${c.email}</p>
            <p class="text-xs text-slate-600 mt-1">📞 <span class="font-mono">${c.phone}</span></p>
          </div>
          <div class="mt-4 pt-3 border-t flex justify-end">
            ${hasPhone ? `
              <button onclick="openWhatsApp('${c.phone.replace(/'/g, "\\'")}', '${c.displayName.replace(/'/g, "\\'")}')" 
                      class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm">
                💬 WhatsApp
              </button>
            ` : `<span class="text-xs text-slate-400">No Tel</span>`}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // GESTIONE MODAL EMAIL
    function openEmailModal() {
      if (currentFilteredContacts.length === 0) {
        alert("Nessun contatto visibile da selezionare.");
        return;
      }
      document.getElementById('modalContactCount').textContent = currentFilteredContacts.length;
      document.getElementById('emailModal').classList.remove('hidden');
    }

    function closeEmailModal() {
      document.getElementById('emailModal').classList.add('hidden');
    }

    async function submitEmailSchedule() {
      const date = document.getElementById('sendDateInput').value;
      const subject = document.getElementById('subjectInput').value.trim();
      const message = document.getElementById('messageInput').value.trim();
      const btn = document.getElementById('sendScheduleBtn');

      if (!date || !subject || !message) {
        alert("Compila tutti i campi (Data, Oggetto e Messaggio).");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Invio in corso...";

      const payload = {
        sendDate: date,
        subject: subject,
        message: message,
        contacts: currentFilteredContacts
      };

      try {
        await fetch(SCRIPT_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert(`Programmazione completata per ${currentFilteredContacts.length} contatti per il giorno ${date}!`);
        closeEmailModal();
      } catch (err) {
        alert("Errore nell'invio della programmazione: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 Programma Invio";
      }
    }

    function exportData(type) {
      const exportList = currentFilteredContacts.map(c => ({
        'Nome Completo': c.displayName, 'Email': c.email, 'Telefono': c.phone, 'Nazione': c.country.name
      }));
      const worksheet = XLSX.utils.json_to_sheet(exportList);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Contatti");
      XLSX.writeFile(workbook, `Contatti_Casa_Mare_Nazioni.${type}`);
    }

    function showStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-slate-50', 'text-slate-700');
      el.classList.add(isError ? 'bg-red-50' : 'bg-slate-50', isError ? 'text-red-700' : 'text-slate-700');
      el.textContent = msg;
    }
  </script>
</body>
</html>
